<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
html,body{margin:0;height:100%}
.tile{display:flex;width:1280px;height:854px;font-family:var(--font-sans)}
.main{flex:1;background:var(--indigo-600);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}
.name{font:800 130px/1 var(--font-sans);color:#fff;letter-spacing:-.03em}
.strip{width:150px;display:flex;flex-direction:column}
.strip span{flex:1}
</style></head>
<body><div class="tile">
  <div class="main">
    <svg width="230" height="230" viewBox="0 0 96 96"><g fill="none" stroke="#fff" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"><path d="M29 28 48 45 67 28"></path><path d="M29 54 48 71 67 54"></path></g></svg>
    <div class="name">AfaqWay</div>
  </div>
  <div class="strip">
    <span style="background:var(--indigo-100)"></span>
    <span style="background:var(--green)"></span>
    <span style="background:var(--amber)"></span>
    <span style="background:var(--red)"></span>
  </div>
</div></body></html>
