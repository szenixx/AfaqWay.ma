<!-- @dsCard group="Spacing" viewport="700x190" name="Radius" subtitle="Controls are capsules; surfaces are 8–28px" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--card);padding:24px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.c{display:flex;flex-direction:column;align-items:center;gap:8px}.b{width:66px;height:58px;background:var(--indigo-tint);border:1px solid var(--indigo-line)}.n{font:600 10.5px/1 var(--font-sans);color:var(--ink)}.px{font:400 9.5px/1 var(--font-sans);color:var(--ink-faint)}</style></head>
<body>
<div class="c"><span class="b" style="border-radius:var(--radius-xs)"></span><span class="n">xs</span><span class="px">4px</span></div>
<div class="c"><span class="b" style="border-radius:var(--radius-sm)"></span><span class="n">sm</span><span class="px">8px</span></div>
<div class="c"><span class="b" style="border-radius:var(--radius-md)"></span><span class="n">md</span><span class="px">12px</span></div>
<div class="c"><span class="b" style="border-radius:var(--radius-lg)"></span><span class="n">lg</span><span class="px">16px</span></div>
<div class="c"><span class="b" style="border-radius:var(--radius-xl)"></span><span class="n">xl</span><span class="px">20px</span></div>
<div class="c"><span class="b" style="border-radius:var(--radius-2xl)"></span><span class="n">2xl</span><span class="px">24px</span></div>
<div class="c"><span class="b" style="border-radius:var(--radius-card)"></span><span class="n">card</span><span class="px">28px</span></div>
<div class="c"><span class="b" style="border-radius:var(--radius-pill);width:88px"></span><span class="n">pill</span><span class="px">999px</span></div>
<div class="c"><span class="b" style="border-radius:var(--radius-circle);width:58px"></span><span class="n">circle</span><span class="px">50%</span></div>
</body></html>
