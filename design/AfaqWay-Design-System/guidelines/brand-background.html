<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans)}.field{position:relative;height:200px;overflow:hidden;background:var(--paper)}.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:360px;background:var(--card);border:var(--card-border);border-radius:var(--radius-2xl);box-shadow:var(--elev-2);padding:22px}.t{font:var(--text-section-title);color:var(--ink)}.d{font:var(--text-hint-sm);color:var(--ink-soft);margin-top:6px}</style></head>
<body><div class="field">
  <div class="card">
    <div class="t">One continuous premium surface</div>
    <div class="d">No gradient, no colour blobs, no texture. The background disappears; hierarchy comes from spacing, layering and radius.</div>
  </div>
</div></body></html>
