<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & borders" subtitle="v2 — matte, near-invisible borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--paper);padding:20px}.row{display:flex;gap:12px}.sw{flex:1;border-radius:var(--radius-md);height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}.n{font:600 11px/14px var(--font-sans);color:var(--ink)}.h{font:500 10px/13px var(--font-sans);color:var(--ink-faint)}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--paper);border:1px solid var(--line)"><span class="n">paper</span><span class="h">#F5F6F8 · page</span></div>
<div class="sw" style="background:var(--card);box-shadow:var(--elev-2)"><span class="n">card</span><span class="h">#FFFFFF</span></div>
<div class="sw" style="background:var(--subtle);border:1px solid var(--line)"><span class="n">subtle</span><span class="h">#F7F8F9 · recessed</span></div>
<div class="sw" style="background:var(--card);border:1px solid var(--line)"><span class="n">line</span><span class="h">#E8E9ED · border</span></div>
<div class="sw" style="background:var(--card);border:1px solid var(--line-soft)"><span class="n">line-soft</span><span class="h">#EFF0F2 · divider</span></div>
</div></body></html>
