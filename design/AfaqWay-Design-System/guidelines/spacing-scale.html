<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base · 1 → 10" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--card);padding:24px;display:flex;align-items:flex-end;gap:16px}.c{display:flex;flex-direction:column;align-items:center;gap:8px}.bar{background:var(--indigo-600);border-radius:4px;width:26px}.n{font:600 10.5px/1 var(--font-sans);color:var(--ink)}.px{font:400 9.5px/1 var(--font-sans);color:var(--ink-faint)}</style></head>
<body>
<div class="c"><span class="bar" style="height:4px"></span><span class="n">1</span><span class="px">4px</span></div>
<div class="c"><span class="bar" style="height:8px"></span><span class="n">2</span><span class="px">8px</span></div>
<div class="c"><span class="bar" style="height:12px"></span><span class="n">3</span><span class="px">12px</span></div>
<div class="c"><span class="bar" style="height:16px"></span><span class="n">4</span><span class="px">16px</span></div>
<div class="c"><span class="bar" style="height:20px"></span><span class="n">5</span><span class="px">20px</span></div>
<div class="c"><span class="bar" style="height:24px"></span><span class="n">6</span><span class="px">24px</span></div>
<div class="c"><span class="bar" style="height:32px"></span><span class="n">8</span><span class="px">32px</span></div>
<div class="c"><span class="bar" style="height:40px"></span><span class="n">10</span><span class="px">40px</span></div>
</body></html>
