<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation" subtitle="xs → xl, floating, modal, popover — one ink hue" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--paper);padding:26px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.c{display:flex;flex-direction:column;align-items:center;gap:8px}.b{width:96px;height:60px;background:var(--card);border:var(--card-border);border-radius:var(--radius-lg)}.n{font:600 10.5px/1 var(--font-sans);color:var(--ink)}.px{font:400 9px/1 var(--font-sans);color:var(--ink-faint)}</style></head>
<body>
<div class="c"><span class="b" style="box-shadow:var(--shadow-xs)"></span><span class="n">xs</span><span class="px">resting</span></div>
<div class="c"><span class="b" style="box-shadow:var(--shadow-sm)"></span><span class="n">sm</span><span class="px">subtle lift</span></div>
<div class="c"><span class="b" style="box-shadow:var(--shadow-md)"></span><span class="n">md</span><span class="px">default card</span></div>
<div class="c"><span class="b" style="box-shadow:var(--shadow-lg)"></span><span class="n">lg</span><span class="px">prominent</span></div>
<div class="c"><span class="b" style="box-shadow:var(--shadow-floating)"></span><span class="n">floating</span><span class="px">hover</span></div>
<div class="c"><span class="b" style="box-shadow:var(--shadow-popover)"></span><span class="n">popover</span><span class="px">menu</span></div>
<div class="c"><span class="b" style="box-shadow:var(--shadow-modal)"></span><span class="n">modal</span><span class="px">dialog</span></div>
</body></html>
