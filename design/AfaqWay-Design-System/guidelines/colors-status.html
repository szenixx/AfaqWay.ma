<!-- @dsCard group="Colors" viewport="700x170" name="Status tones" subtitle="Green · amber · red · indigo · grey — text / tint / line" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--card);padding:20px;display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:center;gap:12px}.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid;font:600 12px/1 var(--font-sans)}.dot{width:9px;height:9px;border-radius:999px}.nm{font:600 11px/1 var(--font-sans);color:var(--ink-faint);width:64px}</style></head>
<body>
<div class="r"><span class="nm">Success</span><span class="chip" style="color:var(--green);background:var(--green-tint);border-color:var(--green-line)"><span class="dot" style="background:var(--green)"></span>Approved · Paid · Online</span></div>
<div class="r"><span class="nm">Warning</span><span class="chip" style="color:var(--amber);background:var(--amber-tint);border-color:var(--amber-line)"><span class="dot" style="background:var(--amber)"></span>Pending · Waiting · Away</span></div>
<div class="r"><span class="nm">Danger</span><span class="chip" style="color:var(--red);background:var(--red-tint);border-color:var(--red-line)"><span class="dot" style="background:var(--red)"></span>Rejected · Failed</span></div>
<div class="r"><span class="nm">Info</span><span class="chip" style="color:var(--indigo-text);background:var(--indigo-tint);border-color:var(--indigo-line)"><span class="dot" style="background:var(--indigo-600)"></span>Processing · Submitted</span></div>
<div class="r"><span class="nm">Neutral</span><span class="chip" style="color:var(--ink-soft);background:var(--grey-tint);border-color:var(--grey-line)"><span class="dot" style="background:var(--grey)"></span>Draft · Cancelled · Offline</span></div>
</body></html>
